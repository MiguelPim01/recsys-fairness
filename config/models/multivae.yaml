seed: 42
reproducibility: true
repeatable: true

data_path: data/sample
field_separator: "\t"

USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
RATING_FIELD: rating
LABEL_FIELD: rating
load_col:
  inter: [user_id, item_id, rating]
  user: [user_id, gender, age, country, signup_date]
  item: [item_id, musicbrainz_artist_id, artist_name]

epochs: 50
eval_step: 1
stopping_step: 5
train_batch_size: 64
eval_batch_size: 64
learning_rate: 0.001
train_neg_sample_args: ~

eval_args:
  split:
    RS: [0.8, 0.1, 0.1]
  order: RO
  group_by: user
  mode: full

metrics: [Recall, NDCG]
topk: [5, 10]
valid_metric: NDCG@10
valid_metric_bigger: true

fairness:
  enabled: true
  output_dir: results
  rating_min: 1.0
  rating_max: 5.0
  activity_fraction: 0.05
  cluster_k_min: 2
  cluster_k_max: 10
  kmeans_n_init: 20

mlp_hidden_size: [600]
latent_dimension: 128
dropout_prob: 0.5
anneal_cap: 0.2
total_anneal_steps: 200000

use_gpu: true
gpu_id: 0
worker: 0
show_progress: true
save_dataset: false
save_dataloaders: false
